image: node:18

pipelines:
  default:
    - step:
        name: Build and Test
        runs-on:
          - self.hosted
          - linux
        caches:
          - node
        script:
          - npm ci
          - npm run lint
          - npm test
          - npm run build
        artifacts:
          - dist/**

  branches:
    development:
      - step:
          name: Build and Test
          caches:
            - node
          script:
            - npm ci
            - npm run lint
            - npm test
            - npm run build
          artifacts:
            - dist/**

  pull-requests:
    '**':
      - step:
          name: Build and Test
          caches:
            - node
          script:
            - npm ci
            - npm run lint
            - npm test
            - npm run build

definitions:
  caches:
    node: node_modules
