image: node:18

definitions:
  caches:
    node: node_modules

pipelines:
  default:
    - step:
        name: Build and Test
        runs-on:
          - self.hosted
          - linux
        caches:
          - node
        script:
          - npm ci
          - npm run lint
          - npm test
          - npm run build
        artifacts:
          - dist/**
    - parallel:
        - step:
            name: Build LG
            runs-on:
              - self.hosted
              - linux
            caches:
              - node
            script:
              - npm install -g @webos-tools/cli
              - ./build_lg.sh
            artifacts:
              - webotv-lg-build-prod
