<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <style>
    html {
      height: 100%;
      width: 100%;
    }

    *,
    body {
      margin: 0;
      padding: 0;
    }

    canvas {
      position: absolute;
      z-index: 2;
    }

    body {
      width: 100%;
      height: 100%;
    }


    #splash {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      pointer-events: none;
      background-color: #1b1b23;
      box-sizing: border-box;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.15s ease-in;
      visibility: hidden;
    }

    #splash video {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      display: block;
      margin: 0 auto;
    }
  </style>
  <script type="text/javascript">
    window.didomiConfig = {
      apiKey: "45bc0cac-837c-4445-bcfb-38d46c396898",
      notice: {
        enable: true
      },
      // user: {
      //   country: 'FR',
      //   regionCode: 'IDF',
      // }
    };
    window.didomiVisible = false;
    window.didomiOnReady = window.didomiOnReady || [];
    window.didomiOnReady.push(function (Didomi) {
      Didomi.on('notice.hidden', function () {
        setTimeout(() => {
          window.didomiVisible = false;
        })
      });
      Didomi.on('notice.shown', function () {
        window.didomiVisible = true;
      });
      Didomi.notice.hide(); // Suppresses the UI container actively
    });
  </script>
  <script type="text/javascript" async="true" src="https://sdk.privacy-center.org/"></script>
  <script type="text/javascript" src="/static/scripts/fix.js"></script>
  <script type="text/javascript" src="/static/scripts/main.js"></script>
</head>

<body>
  <div id="splash">
    <video id="splash-video" src="/static/videos/splash.mp4" preload="auto" muted playsinline></video>
  </div>
  <script type="text/javascript">
    setTimeout(() => {
      window.homepageLoaded = false;
      window.appSplashVideo = document.getElementById('splash-video');
      window.hideSplash = function () {
        window.homepageLoaded = true;
        if (window.appSplashVideo && window.appSplashVideo.currentTime < window.appSplashVideo.duration) {
          window.appSplashVideo.play();
        }
      };

      if (window.appSplashVideo && !localStorage.getItem('languageSwitched')) {
        function onCanPlay() {
          var route = window.location.hash || '/';
          console.log('[splash-video] canplay | route:', route);
          var splashEl = document.getElementById('splash');
          if (splashEl) {
            splashEl.style.visibility = 'visible';
            splashEl.style.opacity = '1';
          }
          window.appSplashVideo.play();
        }
        function onTimeUpdate() {
          if (window.appSplashVideo.currentTime >= 1.2 && !window.homepageLoaded) {
            window.appSplashVideo.removeEventListener('timeupdate', onTimeUpdate);
            window.appSplashVideo.pause();
            insertLightningScripts()
          }
        }
        function onEnded() {
          window.appSplashVideo.removeEventListener('canplay', onCanPlay);
          var splashEl = document.getElementById('splash');
          if (splashEl) {
            splashEl.style.visibility = 'hidden';
            splashEl.style.opacity = '0';
          }
        }
        window.appSplashVideo.addEventListener('canplay', onCanPlay);
        window.appSplashVideo.addEventListener('timeupdate', onTimeUpdate);
        window.appSplashVideo.onended = onEnded;
        try {
          onCanPlay();
        } catch (error) {
          //
        }

      } else {
        insertLightningScripts()
      }

    }, 500)

  </script>
  <script type="module" src="/src/index.js"></script>
</body>

</html>
