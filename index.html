<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <style>
    html {
      height: 100%;
      width: 100%;
    }

    *,
    body {
      margin: 0;
      padding: 0;
    }

    canvas {
      position: absolute;
      z-index: 2;
    }

    body {
      width: 100%;
      height: 100%;
    }


    #splash,
    #loader {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      pointer-events: none;
      background-color: #1b1b23;
      box-sizing: border-box;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.15s ease-in;
      visibility: hidden;
    }

    #splash video {
      width: 100%;
      height: 100%;
      display: block;
      margin: 0 auto;
    }

    #loader img {
      position: absolute;
      left: 50%;
      bottom: 50%;
      width: 75px;
      height: 75px;
      transform: translateX(-50%) translateY(50%);
    }
  </style>
  <script type="text/javascript">
    window.didomiConfig = {
      apiKey: "45bc0cac-837c-4445-bcfb-38d46c396898",
      notice: {
        enable: true
      },
      app: {
        customDomain: "%APP_DOMAIN%",
      },

      // user: {
      //   country: 'FR',
      //   regionCode: 'IDF',
      // }
    };
    window.didomiVisible = false;
    window.didomiOnReady = window.didomiOnReady || [];
    window.didomiOnReady.push(function (Didomi) {
      Didomi.on('notice.hidden', function () {
        setTimeout(() => {
          window.didomiVisible = false;
          document.dispatchEvent(new CustomEvent('didomiVisibilityChanged', { detail: { visible: false } }));
        })
      });
      Didomi.on('notice.shown', function () {
        window.didomiVisible = true;
        document.dispatchEvent(new CustomEvent('didomiVisibilityChanged', { detail: { visible: true } }));
      });
      Didomi.notice.hide(); // Suppresses the UI container actively
    });
  </script>
  <script type="text/javascript" async="true" src="https://sdk.privacy-center.org/"></script>
  <script type="text/javascript" src="/static/scripts/fix.js"></script>
  <script type="text/javascript" src="/static/scripts/main.js"></script>
</head>

<body>
  <div id="splash">
    <video id="splash-video" src="/static/videos/splash.mp4" muted playsinline autoplay="false"></video>
  </div>
  <div id="loader">
    <img id="loader-image" src="/static/images/spinner.svg"></img>
  </div>
  <script type="text/javascript">
    window.homepageLoaded = false;
    window.appSplashVideo = document.getElementById('splash-video');
    var splashEl = document.getElementById('splash');
    if (splashEl) {
      splashEl.style.visibility = 'visible';
      splashEl.style.opacity = '1';
    }
    const loader = document.getElementById('loader');
    const loaderImage = document.getElementById('loader-image');

    function showAppLoader(isSplash = false) {
      if (!loader || !loaderImage) return;
      if (isSplash) {
        loader.style.background = 'transparent'
        loaderImage.style.bottom = '25%'
      }
      loader.style.visibility = 'visible';
      loader.style.opacity = '1';

    }

    function hideAppLoader() {
      if (!loader || !loaderImage) return;
      loader.style.visibility = 'hidden';
      loader.style.opacity = '0';
      loader.style.background = '#1b1b23'
      loaderImage.style.bottom = '50%'
    }
    window.showAppLoader = showAppLoader
    window.hideAppLoader = hideAppLoader

    window.hideSplash = function () {
      window.homepageLoaded = true;
      splashEl.style.visibility = 'hidden';
      splashEl.style.opacity = '0';
    };

    if (window.appSplashVideo && !localStorage.getItem('languageSwitched')) {
      function onEnded() {
        if (!window.homepageLoaded) showAppLoader()
        var splashEl = document.getElementById('splash');
        if (splashEl) {
          splashEl.style.visibility = 'hidden';
          splashEl.style.opacity = '0';
          window.appSplashVideo.onended = function () { };
        }
      }
      window.appSplashVideo.onended = onEnded;
    } else showAppLoader()
  </script>
  <script type="module" src="/src/index.js"></script>
</body>

</html>
