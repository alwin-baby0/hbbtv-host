<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <style>
    html {
      height: 100%;
      width: 100%;
    }

    *,
    body {
      margin: 0;
      padding: 0;
    }

    canvas {
      position: absolute;
      z-index: 2;
    }

    body {
      width: 100%;
      height: 100%;
    }


    #splash {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      pointer-events: none;
      background-color: #1b1b23;
      box-sizing: border-box;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.15s ease-in;
      visibility: hidden;
    }

    #splash video {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      display: block;
      margin: 0 auto;
    }
  </style>
  <script type="text/javascript">
    window.didomiConfig = {
      apiKey: "45bc0cac-837c-4445-bcfb-38d46c396898",
      notice: {
        enable: true
      },
      // user: {
      //   country: 'FR',
      //   regionCode: 'IDF',
      // }
    };
  </script>
  <script type="text/javascript" async="true" src="https://sdk.privacy-center.org/"></script>
  <script type="text/javascript" src="/static/scripts/fix.js"></script>
</head>

<body>
  <div id="splash">
    <video id="splash-video" src="/static/videos/splash.mp4" preload="auto" muted playsinline></video>
  </div>
  <script type="text/javascript">
    window.homepageLoaded = false;
    var splashVideo = document.getElementById('splash-video');
    var splashRoutes = ['/', '#home', '#splash'];
    window.hideSplash = function () {
      window.homepageLoaded = true;
      if (splashVideo && splashVideo.currentTime < splashVideo.duration) {
        splashVideo.play();
      }
    };
    if (splashVideo) {
      function onCanPlay() {
        var route = window.location.hash || '/';
        console.log('[splash-video] canplay | route:', route);
        if (splashRoutes.indexOf(route) !== -1) {
          var splashEl = document.getElementById('splash');
          if (splashEl) {
            splashEl.style.visibility = 'visible';
            splashEl.style.opacity = '1';
          }
          splashVideo.play();
        }
      }
      function onTimeUpdate() {
        if (splashVideo.currentTime >= 1.2 && !window.homepageLoaded) {
          splashVideo.pause();
        }
      }
      function onEnded() {
        splashVideo.removeEventListener('canplay', onCanPlay);
        splashVideo.removeEventListener('timeupdate', onTimeUpdate);
        splashVideo.removeEventListener('ended', onEnded);
        var splashEl = document.getElementById('splash');
        if (splashEl) {
          splashEl.style.visibility = 'hidden';
          splashEl.style.opacity = '0';
        }
      }
      splashVideo.addEventListener('canplay', onCanPlay);
      splashVideo.addEventListener('timeupdate', onTimeUpdate);
      splashVideo.addEventListener('ended', onEnded);
    }
  </script>
  <script type="module" src="/src/index.js"></script>
</body>

</html>
